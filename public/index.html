<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryptarithmetic AI — Powered by Google ADK</title>
    <meta name="description"
        content="Chat with a Gemini-powered AI agent to solve cryptarithmetic puzzles using Backtracking, MRV, and LCV algorithms." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070b14;
            --surface: #0f1629;
            --surface2: #162038;
            --border: #1e2d4a;
            --accent: #6366f1;
            --accent2: #8b5cf6;
            --cyan: #06b6d4;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
            --text: #e2e8f0;
            --muted: #4b6080;
            --glow: 0 0 60px rgba(99, 102, 241, 0.12);
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Ambient glow background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 60% 50% at 15% 10%, rgba(99, 102, 241, 0.07) 0%, transparent 100%),
                radial-gradient(ellipse 50% 40% at 85% 90%, rgba(139, 92, 246, 0.07) 0%, transparent 100%);
        }

        /* ── TOP NAV ── */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.5rem;
            background: rgba(15, 22, 41, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .nav-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }

        .nav-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .nav-subtitle {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 1px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .status-txt {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .new-chat-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── MAIN AREA ── */
        .chat-wrap {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* ── MESSAGES ── */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        #messages::-webkit-scrollbar {
            width: 4px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 2.5rem 1.5rem;
            margin: auto 0;
        }

        .welcome-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4));
        }

        .welcome h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text), #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .quick-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .qp {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-size: 0.82rem;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .qp:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(99, 102, 241, 0.08);
        }

        /* Message bubbles */
        .msg {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            animation: fadeUp 0.25s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .avatar.ai {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }

        .avatar.usr {
            background: linear-gradient(135deg, #1e3a5f, #2d5a8e);
            border: 1px solid #2a4d7c;
        }

        .bubble {
            max-width: 75%;
            padding: 0.85rem 1.1rem;
            border-radius: 14px;
            line-height: 1.7;
            font-size: 0.9rem;
        }

        .msg.ai .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }

        .msg.user .bubble {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-top-right-radius: 4px;
        }

        /* Tool pill */
        .tool-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: var(--cyan);
            border-radius: 6px;
            padding: 0.15rem 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            margin-right: 0.35rem;
        }

        .tool-pills {
            margin-bottom: 0.5rem;
        }

        /* Inline code */
        .bubble code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 0.1em 0.4em;
            border-radius: 4px;
            font-size: 0.88em;
        }

        .bubble pre {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-top: 0.5rem;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.7;
        }

        .bubble strong {
            color: #c4b5fd;
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 0.5rem 0;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0.2;
                transform: scale(0.85);
            }

            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ── INPUT BAR ── */
        .input-bar {
            border-top: 1px solid var(--border);
            padding: 1rem 0 1.25rem;
            background: rgba(7, 11, 20, 0.8);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .input-wrap {
            display: flex;
            gap: 0.6rem;
            align-items: flex-end;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.5rem 0.5rem 0.5rem 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        #userInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            resize: none;
            max-height: 140px;
            min-height: 24px;
            padding: 0.3rem 0;
            line-height: 1.5;
            scrollbar-width: thin;
        }

        #userInput::placeholder {
            color: var(--muted);
        }

        #sendBtn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        #sendBtn:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.05);
        }

        #sendBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .input-hint {
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <nav>
        <div class="nav-brand">
            <div class="nav-logo">C</div>
            <div>
                <div class="nav-title">Cryptarithmetic AI</div>
                <div class="nav-subtitle">Powered by Google ADK · Gemini 2.5 Flash</div>
            </div>
        </div>
        <div class="nav-right">
            <div class="status-dot"></div>
            <span class="status-txt">ADK Agent Online</span>
            <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
        </div>
    </nav>

    <!-- CHAT -->
    <div class="chat-wrap">
        <div id="messages">
            <!-- Welcome screen -->
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🔢</div>
                <h2>Cryptarithmetic AI Agent</h2>
                <p>Ask me to solve puzzles, generate new ones, validate expressions, or get hints.<br />Powered by
                    Google ADK — Gemini decides which tool to call.</p>
                <div class="quick-prompts">
                    <button class="qp" onclick="send('Solve SEND + MORE = MONEY')">Solve SEND + MORE = MONEY</button>
                    <button class="qp" onclick="send('Generate a hard puzzle')">Generate a hard puzzle</button>
                    <button class="qp" onclick="send('Give me a hint for CROSS + ROADS = DANGER at level 2')">Hints for
                        CROSS + ROADS</button>
                    <button class="qp" onclick="send('Is BASE + BALL = GAMES valid?')">Validate BASE + BALL =
                        GAMES</button>
                    <button class="qp" onclick="send('How does the algorithm work?')">How does the algorithm
                        work?</button>
                    <button class="qp" onclick="send('Solve FORTY + TEN = SIXTY')">Solve FORTY + TEN = SIXTY</button>
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-bar">
            <div class="input-wrap">
                <textarea id="userInput" rows="1" placeholder="Ask me to solve, validate, hint, or generate a puzzle…"
                    onkeydown="handleKey(event)"></textarea>
                <button id="sendBtn" onclick="sendMessage()" title="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
            <div class="input-hint">Press <kbd
                    style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:0.7rem">Enter</kbd>
                to send · <kbd
                    style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:0.7rem">Shift+Enter</kbd>
                for new line</div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let isThinking = false;

        function newChat() {
            sessionId = null;
            const msgs = document.getElementById('messages');
            msgs.innerHTML = `<div class="welcome" id="welcome">
      <div class="welcome-icon">🔢</div>
      <h2>Cryptarithmetic AI Agent</h2>
      <p>Ask me to solve puzzles, generate new ones, validate expressions, or get hints.<br/>Powered by Google ADK — Gemini decides which tool to call.</p>
      <div class="quick-prompts">
        <button class="qp" onclick="send('Solve SEND + MORE = MONEY')">Solve SEND + MORE = MONEY</button>
        <button class="qp" onclick="send('Generate a hard puzzle')">Generate a hard puzzle</button>
        <button class="qp" onclick="send('Give me a hint for CROSS + ROADS = DANGER at level 2')">Hints for CROSS + ROADS</button>
        <button class="qp" onclick="send('Is BASE + BALL = GAMES valid?')">Validate BASE + BALL = GAMES</button>
        <button class="qp" onclick="send('How does the algorithm work?')">How does the algorithm work?</button>
        <button class="qp" onclick="send('Solve FORTY + TEN = SIXTY')">Solve FORTY + TEN = SIXTY</button>
      </div>
    </div>`;
        }

        function send(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            // Auto-grow textarea
            const ta = document.getElementById('userInput');
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
        }

        function removeWelcome() {
            const w = document.getElementById('welcome');
            if (w) w.remove();
        }

        function appendMsg(role, html, tools = []) {
            removeWelcome();
            const msgs = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            const toolsHtml = tools.length
                ? `<div class="tool-pills">${tools.map(t => `<span class="tool-pill">⚡ ${t}</span>`).join('')}</div>`
                : '';
            div.innerHTML = `
      <div class="avatar ${role}">${role === 'ai' ? '🤖' : '👤'}</div>
      <div class="bubble">${toolsHtml}${html}</div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
            return div;
        }

        function showTyping() {
            removeWelcome();
            const msgs = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg ai'; div.id = 'typing-indicator';
            div.innerHTML = `<div class="avatar ai">🤖</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById('typing-indicator');
            if (t) t.remove();
        }

        // Simple markdown-like formatter
        function format(text) {
            return text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br/>');
        }

        async function sendMessage() {
            if (isThinking) return;
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';
            isThinking = true;
            document.getElementById('sendBtn').disabled = true;

            appendMsg('user', format(text));
            showTyping();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId }),
                });

                if (!res.ok) throw new Error(`API error: ${res.status}`);
                const data = await res.json();

                sessionId = data.session_id;
                removeTyping();
                appendMsg('ai', format(data.reply), data.tool_calls || []);

            } catch (err) {
                removeTyping();
                appendMsg('ai', `<span style="color:var(--red)">❌ ${err.message}</span>`);
            } finally {
                isThinking = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }
    </script>
</body>

</html>
